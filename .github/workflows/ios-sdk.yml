name: ios-sdk
# Step 1: does the ReXGlue SDK runtime compile for iOS arm64? (no game files needed)
on:
  workflow_dispatch: {}
  push:
    paths: ['patches/**', '.github/workflows/ios-sdk.yml']

jobs:
  sdk:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        vulkan: ['ON']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install ninja || true
          mkdir -p ~/.cache/CPM

      - name: Fetch ReXGlue SDK (pinned to the commit the port was built against)
        run: |
          git clone https://github.com/rexglue/rexglue-sdk sdk
          git -C sdk checkout c94f5ebdcb3c9d1a460ca48e04f9758448f8d518
          git -C sdk submodule update --init --recursive --jobs 8

      - name: Fetch the port (for its SDK patch)
        run: git clone --depth 1 https://github.com/KaikoClanworth1/wwe-svr2011-pc port-src

      - name: Apply patches
        run: |
          git -C sdk apply --whitespace=nowarn ../port-src/port/patches/rexglue-sdk-svr2011.patch
          for p in patches/*.patch; do echo "applying $p"; git -C sdk apply --whitespace=nowarn "../$p"; done

      - name: Patch MoltenVK CMake for iOS (skip AppKit)
        run: |
          F=sdk/thirdparty/moltenvk/Common/CMakeLists.txt
          perl -i -pe 's/^(\s*find_library\(APPKIT_LIBRARY.*)$/if(NOT IOS)\n$1\nendif()/' "$F"

      - name: Patch threading_posix.cpp for iOS (pthread_gettid_np is Android-only)
        run: |
          F=sdk/src/core/threading_posix.cpp
          echo "---- before ----"; sed -n 1060,1085p "$F"
          perl -i -pe 's/return pthread_gettid_np\(thread_\);/return [&]{ uint64_t t__ = 0; pthread_threadid_np(thread_, &t__); return static_cast<pid_t>(t__); }();/' "$F"
          echo "---- after ----"; sed -n 1060,1085p "$F"

      - name: Configure (iOS arm64)
        run: |
          cmake -S sdk -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXGLUE_USE_VULKAN=${{ matrix.vulkan }} \
            -DREXGLUE_ENABLE_TRACY=OFF \
            2>&1 | tee configure.log

      - name: Build everything (keep going, so one run shows every error)
        run: cmake --build build -- -k 0 2>&1 | tee build.log

      - name: Collect built libraries
        if: always()
        run: |
          mkdir -p out-libs
          find build -name "*.a" -exec cp {} out-libs/ \; || true
          ls -la out-libs

      - name: Error summary
        if: always()
        run: |
          {
            echo "### vulkan=${{ matrix.vulkan }}"
            echo '```'
            grep -hE "error:|CMake Error|FAILED:|fatal error" configure.log build.log 2>/dev/null | sed -E 's#/Users/runner/work/[^/]+/[^/]+/##' | sort -u | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-vulkan-${{ matrix.vulkan }}
          path: |
            configure.log
            build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-libs
          path: out-libs
